#==============================================================================
# Project Information
#==============================================================================

PROJECT_NAME="VICON"
PROJECT_VERSION="1"
PROJECT_AUTHOR="Carlos Gómez"
PROJECT_BRIEF="Sistema de Visión Configurable"
#==============================================================================
# Project Directories (relativas a PROJECT_ROOT)
#==============================================================================

SOURCE_DIR="01-Sources"
TESTBENCH_DIR="05-TestBench"
DOCUMENT_DIR="00-Documents"
TOOLS_DIR="10-Tools"
BUILD_DIR="09-Build"
EXTRA_PAGES="00-Documents/01-DoxygenExtraPages"
EXTRA_SOURCE_DIRS="05-TestBench/02-Simulation"

#==============================================================================
# VHDL Settings
#==============================================================================

VHDL_STANDARD="08"

#==============================================================================
# Doxygen Configuration Extensions (Opcionales por proyecto)
#==============================================================================

# Carpetas/archivos a excluir de la documentación (separados por espacio).
# Ejemplos: "01-Sources/deprecated OLD 00-Documents/drafts"
DOXYGEN_EXCLUDE=""

# Rutas adicionales donde buscar imágenes (separadas por espacio).
# Ejemplos: "00-Documents/02-Images 00-Documents/diagrams"
IMAGE_PATHS="00-Documents/02-Images \
 00-Documents/03-Diagrams \
 00-Documents/04-Latex/gfx \
 10-Tools/02-Documentation/04-FrameworkDocs/Images "

# Archivos HTML extra a incluir, p. ej. diagramas de ondas o interactivos.
# Ejemplos: "00-Documents/diagrams/interactive_wave.html"
HTML_EXTRA_FILES="00-Documents/01-DoxygenExtraPages/system.html \
 00-Documents/04-Latex/report/build/main.pdf \
 10-Tools/02-Documentation/04-FrameworkDocs/Diagrams/framework.html"

